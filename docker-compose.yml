version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusar
      POSTGRES_PASSWORD: campusar
      POSTGRES_DB: campusar
    ports:
      - "5432:5432"
    volumes:
      - campusar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://campusar:campusar@db:5432/campusar
      CAMPUS_ID: tongmyong-main
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"

volumes:
  campusar_db_data:
